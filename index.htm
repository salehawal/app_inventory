<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory App</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --danger: #dc2626;
      --shadow: 0 12px 36px rgba(15, 23, 42, 0.12);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .secondary {
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent-strong);
    }

    .secondary:hover {
      background: rgba(37, 99, 235, 0.2);
    }

    .ghost {
      background: transparent;
      color: var(--text);
    }

    .ghost:hover {
      background: rgba(15, 23, 42, 0.05);
    }

    .danger {
      color: var(--danger);
    }

    .danger:hover {
      background: rgba(220, 38, 38, 0.08);
    }

    .small {
      padding: 0.35rem 0.65rem;
      font-size: 0.85rem;
    }

    .welcome {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.5rem;
      background: radial-gradient(circle at top, #ffffff 0, #edf2f7 45%, #e0e7ff 100%);
    }

    .card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 2.5rem 2.25rem;
      box-shadow: var(--shadow);
      display: grid;
      gap: 1.25rem;
    }

    .card h1 {
      margin: 0;
      font-size: 1.9rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }

    .form-stack {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input,
    select,
    textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      background: #ffffff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .message {
      min-height: 1.1rem;
      margin-top: 0.2rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .message.error {
      color: var(--danger);
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      background: var(--bg);
    }

    .sidebar {
      background: #111827;
      color: #f9fafb;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: grid;
      gap: 0.35rem;
    }

    .brand .logo {
      font-size: 2.4rem;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .nav {
      display: grid;
      gap: 0.5rem;
    }

    .nav-link {
      justify-content: flex-start;
      text-align: left;
      background: rgba(255, 255, 255, 0.08);
      color: #f9fafb;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .nav-link.active {
      background: #f9fafb;
      color: #1f2937;
    }

    .logout {
      margin-top: auto;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f9fafb;
    }

    .logout:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .content {
      padding: 2.5rem;
      display: grid;
      gap: 2rem;
    }

    .view {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .view.active {
      display: flex;
    }

    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .view-header h2 {
      margin: 0 0 0.25rem;
      font-size: 2rem;
    }

    .panel {
      background: var(--panel);
      border-radius: 18px;
      padding: 1.75rem;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      display: grid;
      gap: 1rem;
    }

    .form-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background: rgba(37, 99, 235, 0.08);
    }

    th,
    td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      vertical-align: top;
    }

    .table-panel {
      padding: 0;
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .table-actions {
      display: flex;
      gap: 0.35rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 1.5rem 0;
    }

    .stat {
      display: grid;
      text-align: right;
      gap: 0.2rem;
    }

    .stat-value {
      font-size: 2.4rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.16);
      color: var(--accent-strong);
      padding: 0.15rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .tool-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .import-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      cursor: pointer;
      position: relative;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      overflow: hidden;
    }

    .import-label span {
      pointer-events: none;
    }

    .import-label input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .image-field {
      display: grid;
      gap: 0.75rem;
    }

    .image-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .image-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    }

    .image-card {
      background: rgba(37, 99, 235, 0.06);
      border-radius: 12px;
      border: 1px solid rgba(37, 99, 235, 0.15);
      padding: 0.75rem;
      display: grid;
      gap: 0.45rem;
    }

    .image-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    .image-card figcaption {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .image-card small {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .image-empty {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .meta-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.35rem;
      font-size: 0.95rem;
    }

    .meta-list strong {
      margin-right: 0.5rem;
    }

    .location-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.5rem;
    }

    .location-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.18);
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      gap: 1rem;
    }

    .location-entry span {
      font-weight: 600;
    }

    @media (max-width: 1080px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
        border-bottom-left-radius: 24px;
        border-bottom-right-radius: 24px;
      }

      .content {
        padding: 2rem 1.5rem 3rem;
      }
    }

    @media (max-width: 720px) {
      .view-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .stat {
        width: 100%;
        text-align: left;
      }

      .form-actions {
        width: 100%;
      }

      .tool-grid {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const Core = {};

    Core.x_defaults = {
      version: 4,
      db() {
        const now = () => new Date().toISOString();
        return {
          version: this.version,
          users: [
            { id: "admin", name: "admin", role: "admin", password: "admin123" },
            { id: "user", name: "user", role: "user", password: "user123" }
          ],
          locations: ["Main Warehouse", "Cold Storage", "Showroom"],
          items: [
            {
              id: "seed-item-001",
              sku: "INV-001",
              name: "Barcode Scanner",
              description: "Wireless scanner staged for intake checkpoints.",
              quantity: 3,
              location: "Main Warehouse",
              createdBy: "admin",
              createdAt: now(),
              images: []
            },
            {
              id: "seed-item-002",
              sku: "INV-002",
              name: "Refrigerated Crate",
              description: "Temperature-controlled crate reserved for perishables.",
              quantity: 12,
              location: "Cold Storage",
              createdBy: "admin",
              createdAt: now(),
              images: []
            },
            {
              id: "seed-item-003",
              sku: "INV-003",
              name: "Showroom Display Kit",
              description: "Demo bundle for showroom product launches.",
              quantity: 6,
              location: "Showroom",
              createdBy: "admin",
              createdAt: now(),
              images: []
            }
          ],
          logs: [],
          settings: {
            apiUrl: "",
            autoSync: true
          }
        };
      }
    };

    Core.x_keys = {
      storage: "inventory_db",
      session: "inventory_session"
    };

    Core.x_state = {
      db: null,
      session: null,
      activeView: "dashboard",
      inventoryDraftImages: [],
      editingItem: null,
      editingUser: null,
      storageError: false
    };

    Core.i_utils = {
      clone(value) {
        if (typeof structuredClone === "function") {
          try {
            return structuredClone(value);
          } catch (error) {
            console.warn("structuredClone failed, using JSON clone fallback", error);
          }
        }
        return JSON.parse(JSON.stringify(value));
      },
      randomId() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          try {
            return crypto.randomUUID();
          } catch (error) {
            console.warn("crypto.randomUUID failed, using fallback id", error);
          }
        }
        return `id-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`;
      },
      timestamp() {
        return new Date().toISOString();
      },
      formatDate(value) {
        if (!value) return "—";
        try {
          return new Intl.DateTimeFormat(undefined, {
            dateStyle: "medium",
            timeStyle: "short"
          }).format(new Date(value));
        } catch (err) {
          return value;
        }
      },
      formatBytes(bytes) {
        if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        const exponent = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const value = bytes / Math.pow(1024, exponent);
        return `${value.toFixed(1)} ${units[exponent]}`;
      },
      escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      },
      escapeAttr(value) {
        return this.escapeHTML(value);
      },
      normalizeUser(user) {
        const candidate = typeof user === "object" && user !== null ? user : {};
        const idCandidate = typeof candidate.id === "string" ? candidate.id.trim() : "";
        const usernameCandidate = typeof candidate.username === "string" ? candidate.username.trim() : "";
        const nameCandidate = typeof candidate.name === "string" ? candidate.name.trim() : "";
        const resolvedId = idCandidate || usernameCandidate || nameCandidate || this.randomId();
        const roleCandidate = typeof candidate.role === "string" ? candidate.role.trim().toLowerCase() : "";
        const resolvedRole = roleCandidate === "admin" ? "admin" : "user";
        const passwordCandidate = typeof candidate.password === "string" ? candidate.password.trim() : "";
        const resolvedPassword = passwordCandidate || "password";
        return {
          id: resolvedId,
          name: resolvedId,
          role: resolvedRole,
          password: resolvedPassword
        };
      },
      normalizeDb(rawDb) {
        const defaults = Core.x_defaults.db();
        if (!rawDb || typeof rawDb !== "object") {
          return this.clone(defaults);
        }
        const source = this.clone(rawDb);
        const normalized = this.clone(defaults);

        const incomingUsers = Array.isArray(source.users) ? source.users : normalized.users;
        normalized.users = incomingUsers.map((entry) => this.normalizeUser(entry));

        const locationMap = new Map();
        const registerLocation = (value) => {
          if (typeof value !== "string") return;
          const trimmed = value.trim();
          if (!trimmed) return;
          const key = trimmed.toLowerCase();
          if (!locationMap.has(key)) {
            locationMap.set(key, trimmed);
          }
        };
        defaults.locations.forEach(registerLocation);
        if (Array.isArray(source.locations)) {
          source.locations.forEach(registerLocation);
        }

        const baseItems = Array.isArray(source.items) ? source.items : defaults.items;
        normalized.items = baseItems.map((item) => {
          const record = typeof item === "object" && item !== null ? item : {};
          const locationValue = typeof record.location === "string" ? record.location.trim() : "";
          if (locationValue) {
            registerLocation(locationValue);
          }
          const createdBy = typeof record.createdBy === "string" ? record.createdBy.trim() : "admin";
          const createdAt = (() => {
            const candidate = typeof record.createdAt === "string" ? record.createdAt : "";
            const date = new Date(candidate);
            return Number.isFinite(date.valueOf()) ? date.toISOString() : new Date().toISOString();
          })();
          return {
            ...record,
            id: record.id || this.randomId(),
            name: typeof record.name === "string" && record.name.trim() ? record.name.trim() : "Untitled Item",
            sku: typeof record.sku === "string" ? record.sku.trim() : "",
            description: typeof record.description === "string" ? record.description.trim() : "",
            quantity: Number.isFinite(Number(record.quantity)) ? Number(record.quantity) : 0,
            location: locationValue,
            createdBy: createdBy || "admin",
            createdAt,
            images: Array.isArray(record.images) ? record.images : []
          };
        });

        normalized.logs = Array.isArray(source.logs) ? source.logs : normalized.logs;

        const mergedSettings = Object.assign({}, defaults.settings, typeof source.settings === "object" ? source.settings : {});
        normalized.settings = {
          apiUrl: typeof mergedSettings.apiUrl === "string" ? mergedSettings.apiUrl.trim() : "",
          autoSync: mergedSettings.autoSync !== false
        };

        normalized.version = typeof source.version === "number" ? Math.max(source.version, defaults.version) : defaults.version;

        normalized.locations = Array.from(locationMap.values());
        if (!normalized.locations.length) {
          normalized.locations = this.clone(defaults.locations);
        }

        const dedupedUsers = Array.from(
          new Map(
            normalized.users.map((user) => [user.id.toLowerCase(), { ...user, id: user.id.trim() }])
          ).values()
        ).map((user) => ({ ...user, name: user.id }));
        const adminTemplate = defaults.users[0];
        const hasAdmin = dedupedUsers.some((user) => user.id.toLowerCase() === "admin");
        if (!hasAdmin) {
          dedupedUsers.unshift(this.clone(adminTemplate));
        } else {
          const adminIdx = dedupedUsers.findIndex((user) => user.id.toLowerCase() === "admin");
          dedupedUsers[adminIdx] = {
            ...dedupedUsers[adminIdx],
            id: "admin",
            name: "admin",
            role: "admin",
            password: adminTemplate.password
          };
        }
        normalized.users = dedupedUsers.sort((a, b) => a.id.toLowerCase().localeCompare(b.id.toLowerCase()));

        return normalized;
      },
      resolveUserName(id) {
        if (!id || !Core.x_state.db) {
          return "—";
        }
        return Core.x_state.db.users.find((user) => user.id === id)?.id || id;
      },
      async readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
          reader.readAsDataURL(file);
        });
      }
    };

    Core.o_log = {
      storageFailure(context, error) {
        console.error(`Inventory App storage failure during ${context}`, error);
      }
    };

    Core.a_system = {
      flagStorageError(context, error) {
        Core.o_log.storageFailure(context, error);
        Core.x_state.storageError = true;
      }
    };

    Core.o_storage = {
      loadDb() {
        try {
          const raw = localStorage.getItem(Core.x_keys.storage);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          Core.a_system.flagStorageError("load database", error);
          return null;
        }
      },
      saveDb(db) {
        try {
          localStorage.setItem(Core.x_keys.storage, JSON.stringify(db));
        } catch (error) {
          Core.a_system.flagStorageError("save database", error);
        }
      },
      loadSession() {
        try {
          const raw = sessionStorage.getItem(Core.x_keys.session);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          Core.a_system.flagStorageError("load session", error);
          return null;
        }
      },
      saveSession(session) {
        try {
          sessionStorage.setItem(Core.x_keys.session, JSON.stringify(session));
        } catch (error) {
          Core.a_system.flagStorageError("save session", error);
        }
      },
      clearSession() {
        try {
          sessionStorage.removeItem(Core.x_keys.session);
        } catch (error) {
          Core.a_system.flagStorageError("clear session", error);
        }
      }
    };

    Core.o_dom = {
      $(selector, scope = document) {
        return scope.querySelector(selector);
      },
      $$(selector, scope = document) {
        return Array.from(scope.querySelectorAll(selector));
      },
      setMessage(el, message, type = "") {
        if (!el) return;
        el.textContent = message;
        el.classList.toggle("error", type === "error");
      },
      swapApp(node) {
        const host = this.$("#app");
        if (!host) return;
        host.innerHTML = "";
        host.appendChild(node);
      }
    };

    Core.o_render = {
      login() {
        return `
      <div class="welcome">
        <div class="card" role="form" aria-labelledby="loginTitle">
          <div>
            <h1 id="loginTitle">Inventory App</h1>
            <p class="muted">Sign in using your assigned role to manage inventory records.</p>
          </div>
          <div class="form-stack">
            <label>
              Email or ID
              <input id="loginId" type="text" autocomplete="username" placeholder="username" />
            </label>
            <label>
              Password
              <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••" />
            </label>
            <button class="primary" id="loginBtn">Sign In</button>
            <p class="message" id="loginMessage"></p>
          </div>
          ${Core.x_state.storageError ? '<p class="message error">Browser storage is unavailable; changes will not persist.</p>' : ''}
          <p class="hint">Admin: admin / admin123 — User: user / user123</p>
        </div>
      </div>
    `;
      },
      sidebar(user) {
        const safeName = Core.i_utils.escapeHTML(user?.name || "Unknown");
        const isAdmin = user?.role === "admin";
        const inventoryNav = isAdmin
          ? ""
          : `<button class="nav-link ${Core.x_state.activeView === "inventory" ? "active" : ""}" data-nav="inventory">Inventory</button>`;
        const usersNav = isAdmin
          ? `<button class="nav-link ${Core.x_state.activeView === "users" ? "active" : ""}" data-nav="users">Users</button>`
          : "";
        const settingsNav = isAdmin
          ? `<button class="nav-link ${Core.x_state.activeView === "settings" ? "active" : ""}" data-nav="settings">Settings</button>`
          : "";
        return `
      <aside class="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true">📦</div>
          <h1>Inventory App</h1>
          <p class="muted">Signed in as <strong>${safeName}</strong></p>
        </div>
        <nav class="nav" aria-label="Primary">
          <button class="nav-link ${Core.x_state.activeView === "dashboard" ? "active" : ""}" data-nav="dashboard">Overview</button>
          ${inventoryNav}
          ${usersNav}
          ${settingsNav}
        </nav>
        <button class="ghost logout" id="logoutBtn">Sign Out</button>
      </aside>
    `;
      },
      dashboardView(user) {
        const totalItems = Core.x_state.db.items.length;
        const totalQuantity = Core.x_state.db.items.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        const ownItems = Core.x_state.db.items.filter((item) => item.createdBy === user?.id).length;
        return `
      <section class="view ${Core.x_state.activeView === "dashboard" ? "active" : ""}" data-view="dashboard">
        <header class="view-header">
          <div>
            <h2>Control Center</h2>
            <p class="muted">Monitor inventory flow and track contributions across the team.</p>
            ${Core.x_state.storageError ? '<p class="message error">Browser storage is unavailable; data may reset after refresh.</p>' : ''}
          </div>
        </header>
        <div class="panel" role="list">
          <div class="stat" role="listitem">

    Core.o_files = {
      downloadJSON(filename, payload) {
        try {
          const blob = new Blob([payload], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = filename;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
          return true;
        } catch (error) {
          console.error("Export failed", error);
          return false;
        }
      }

    Core.a_db = {

        this.persist();

        Core.o_storage.saveDb(Core.x_state.db);

    Core.a_session = {
      initialize() {
        const cached = Core.o_storage.loadSession();
        if (!cached) return;
        const user = Core.x_state.db.users.find((entry) => entry.id === cached.userId);
        if (user) {
          Core.x_state.session = { userId: user.id };
        } else {
          Core.o_storage.clearSession();
        }
      },
      currentUser() {
        if (!Core.x_state.session) return null;
        return Core.x_state.db.users.find((user) => user.id === Core.x_state.session.userId) || null;
      },
      persist() {
        if (Core.x_state.session) {
          Core.o_storage.saveSession(Core.x_state.session);
        }
      },
      authenticate({ identifier, password, messageEl }) {
        const trimmedId = (identifier || "").trim();
        const trimmedPassword = (password || "").trim();
        if (!trimmedId || !trimmedPassword) {
          Core.o_dom.setMessage(messageEl, "Enter your ID or name and password.", "error");
          return false;
        }
        const normalizedId = trimmedId.toLowerCase();
        const user = Core.x_state.db.users.find((entry) => {
          if (typeof entry?.password !== "string") return false;
          const matchesId = typeof entry?.id === "string" && entry.id.toLowerCase() === normalizedId;
          const matchesName = typeof entry?.name === "string" && entry.name.toLowerCase() === normalizedId;
          const storedPassword = entry.password.trim();
          return (matchesId || matchesName) && storedPassword === trimmedPassword;
        });
        if (!user && normalizedId === "admin" && trimmedPassword === "admin123") {
          const adminTemplate = Core.i_utils.clone(Core.x_defaults.db().users[0]);
          Core.x_state.db.users.unshift(adminTemplate);
          Core.a_db.persist();
          Core.x_state.session = { userId: adminTemplate.id };
          this.persist();
          Core.a_views.renderApp();
          return true;
        }
        if (!user) {
          Core.o_dom.setMessage(messageEl, "Invalid credentials. Try again.", "error");
          return false;
        }
        Core.x_state.session = { userId: user.id };
        Core.o_dom.setMessage(messageEl, "");
        this.persist();
        Core.a_views.renderApp();
        return true;
      },
      logout() {
        Core.x_state.session = null;
        Core.o_storage.clearSession();
        Core.x_state.activeView = "dashboard";
        Core.a_views.renderApp();
      }
    };

        const now = Core.i_utils.timestamp();
        if (payload.id) {
          const index = Core.x_state.db.items.findIndex((item) => item.id === payload.id);
          if (index !== -1) {
            Core.x_state.db.items[index] = {
              ...Core.x_state.db.items[index],

              updatedAt: now
            };

            createdAt: now,

          });

        const currentUser = Core.a_session.currentUser();
        const isAdmin = currentUser?.role === "admin";
        const payload = {
          id: Core.o_dom.$("#itemId", scope).value || null,
          name: Core.o_dom.$("#itemName", scope).value.trim(),
          sku: Core.o_dom.$("#itemSku", scope).value.trim(),
          quantity: Number(Core.o_dom.$("#itemQuantity", scope).value || 0),
          location: (locationSelect?.value || "").trim(),
          description: Core.o_dom.$("#itemDescription", scope).value.trim(),
          images: Core.i_utils.clone(Core.x_state.inventoryDraftImages)
        };
        if (!payload.name) {
          Core.o_dom.setMessage(message, "Item name is required.", "error");
          return;
        }
        if (!payload.location) {
          Core.o_dom.setMessage(message, "Select a location before saving.", "error");
          return;
        }
        if (!isAdmin && payload.id) {
          Core.o_dom.setMessage(message, "Users can only add new items.", "error");
          return;
        }
        this.upsertItem(payload);
        this.resetForm(scope, true);
        Core.o_dom.setMessage(message, payload.id ? "Item updated." : "Item added successfully.");
        Core.x_state.activeView = "inventory";
        Core.a_views.refresh();
      },
      preview(item) {
        Core.o_render.openPreviewModal(item);
      }
    };

    Core.a_users = {
      upsert(payload) {
        const id = typeof payload.id === "string" ? payload.id.trim() : "";
        if (!id) return;
        const role = payload.role === "admin" ? "admin" : "user";
        const passwordInput = typeof payload.password === "string" ? payload.password.trim() : "";
        const existingIndex = Core.x_state.db.users.findIndex((user) => user.id === id);
        if (existingIndex !== -1) {
          const current = Core.x_state.db.users[existingIndex];
          const password = passwordInput || current.password || "password";
          Core.x_state.db.users[existingIndex] = { ...current, id, name: id, role, password };
        } else {
          const password = passwordInput || "password";
          Core.x_state.db.users.push({ id, name: id, role, password });
        }
        Core.x_state.db.users = Array.from(
          new Map(
            Core.x_state.db.users.map((user) => [user.id.toLowerCase(), { ...user, id: user.id.trim() }])
          ).values()
        )
          .map((user) => ({ ...user, name: user.id }))
          .sort((a, b) => a.id.toLowerCase().localeCompare(b.id.toLowerCase()));
        Core.a_db.persist();
        Core.a_views.refresh();
      },
      delete(id) {
        Core.x_state.db.users = Core.x_state.db.users.filter((user) => user.id !== id);
        Core.a_db.persist();
        Core.a_views.refresh();
      }
    };

    Core.a_settings = {
      saveSettings({ apiUrl, autoSync }, messageEl) {
        Core.x_state.db.settings.apiUrl = apiUrl;
        Core.x_state.db.settings.autoSync = autoSync;
        Core.a_db.persist();
        Core.o_dom.setMessage(messageEl, autoSync ? "Settings saved. Sync enabled." : "Settings saved. Sync disabled.");
      },
      addLocation(name, messageEl) {
        const trimmed = (name || "").trim();
        if (!trimmed) {
          Core.o_dom.setMessage(messageEl, "Location name is required.", "error");
          return;
        }
        const exists = Core.x_state.db.locations.some((location) => location.toLowerCase() === trimmed.toLowerCase());
        if (exists) {
          Core.o_dom.setMessage(messageEl, "Location already exists.", "error");
          return;
        }
        Core.x_state.db.locations.push(trimmed);
        Core.x_state.db.locations = Array.from(
          new Map(
            Core.x_state.db.locations.map((entry) => {
              const value = typeof entry === "string" ? entry.trim() : "";
              return [value.toLowerCase(), value];
            })
          ).values()
        )
          .filter(Boolean)
          .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
        Core.a_db.persist();
        Core.o_dom.setMessage(messageEl, "Location added.");
        Core.a_views.refresh();
      },
      removeLocation(name, messageEl) {
        const target = (name || "").toLowerCase();
        if (!target) {
          return;
        }
        const inUse = Core.x_state.db.items.some((item) => (item.location || "").toLowerCase() === target);
        if (inUse) {
          Core.o_dom.setMessage(messageEl, "Cannot remove a location that is in use.", "error");
          return;
        }
        Core.x_state.db.locations = Core.x_state.db.locations.filter((location) => location.toLowerCase() !== target);
        Core.x_state.db.locations.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
        Core.a_db.persist();
        Core.o_dom.setMessage(messageEl, "Location removed.");
        Core.a_views.refresh();
      },
      exportDb(messageEl) {
        const payload = JSON.stringify(Core.x_state.db, null, 2);
        const success = Core.o_files.downloadJSON(`inventory-backup-${Date.now()}.json`, payload);
        const type = success ? "" : "error";
        Core.o_dom.setMessage(messageEl, success ? "Database exported." : "Failed to export database.", type);
      },
      resetDb(messageEl) {
        Core.a_db.reset();
        Core.o_dom.setMessage(messageEl, "Database formatted.");
        Core.x_state.activeView = "settings";
        Core.a_views.refresh();
      },
      async importDb(file, messageEl) {
        try {
          const text = await file.text();
          const imported = JSON.parse(text);
          Core.a_db.replace(imported);
          Core.o_dom.setMessage(messageEl, "Database imported successfully.");
          Core.x_state.activeView = "settings";
          Core.a_views.refresh();
        } catch (error) {
          console.error("Import failed", error);
          Core.o_dom.setMessage(messageEl, "Failed to import database.", "error");
        }
      }
    };

    Core.h_events = {
      bindLogin(scope) {
        Core.o_dom.$("#loginBtn", scope)?.addEventListener("click", (event) => {
          event.preventDefault();
          const identifier = Core.o_dom.$("#loginId", scope)?.value || "";
          const password = Core.o_dom.$("#loginPassword", scope)?.value || "";
          const messageEl = Core.o_dom.$("#loginMessage", scope);
          Core.a_session.authenticate({ identifier, password, messageEl });
        });
      },
      bindDashboard(scope, user) {
        Core.o_dom.$$('[data-nav]', scope).forEach((button) => {
          button.addEventListener("click", () => {
            Core.x_state.activeView = button.dataset.nav;
            Core.a_views.renderApp();
          });
        });
        Core.o_dom.$("#logoutBtn", scope)?.addEventListener("click", () => {
          Core.a_session.logout();
        });
        this.bindInventory(scope, user);
        this.bindUsers(scope);
        this.bindSettings(scope);
      },
      bindInventory(scope, user) {
        const inventoryView = Core.o_dom.$('[data-view="inventory"]', scope);
        if (!inventoryView) return;
        const form = Core.o_dom.$("#inventoryForm", scope);
        const message = Core.o_dom.$("#itemMessage", scope);
        Core.a_inventory.refreshDraft(scope);
        Core.a_inventory.syncLocationState(scope);
        form?.addEventListener("submit", (event) => {
          event.preventDefault();
          Core.a_inventory.submit(scope);
        });
        Core.o_dom.$("#resetItem", scope)?.addEventListener("click", (event) => {
          event.preventDefault();
          Core.a_inventory.resetForm(scope);
        });
        Core.o_dom.$("#clearImages", scope)?.addEventListener("click", () => {
          Core.a_inventory.clearDraft(scope);
        });
        Core.o_dom.$("#itemImages", scope)?.addEventListener("change", async (event) => {
          const files = Array.from(event.target.files || []);
          if (!files.length) return;
          await Core.a_inventory.addDraftImages(files, scope);
          event.target.value = "";
        });
        Core.o_dom.$$('[data-action]', inventoryView).forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.action;
            const row = button.closest("tr");
            if (!row) return;
            const item = Core.x_state.db.items.find((entry) => entry.id === row.dataset.id);
            if (!item) return;
            if (action === "preview") {
              Core.a_inventory.preview(item);
              return;
            }
            if (action === "edit") {
              if (user.role !== "admin") {
                Core.o_dom.setMessage(message, "Only admins can edit existing items.", "error");
                return;
              }
              Core.a_inventory.populateForm(item, scope);
              return;
            }
            if (action === "delete") {
              const promptText = user.role === "admin"
                ? "Delete this item and all attached images?"
                : "Remove this item from inventory?";
              if (confirm(promptText)) {
                Core.a_inventory.deleteItem(item.id);
                Core.o_dom.setMessage(message, "Item removed.");
                Core.a_views.refresh();
              }
            }
          });
        });
      },
      bindDraftImageRemoval(scope) {
        const gallery = Core.o_dom.$("#draftGallery", scope);
        if (!gallery) return;
        Core.o_dom.$$('[data-remove-image]', gallery).forEach((button) => {
          button.addEventListener("click", () => {
            Core.a_inventory.removeDraftImage(button.dataset.removeImage, scope);
          });
        });
      },
      bindUsers(scope) {
        const view = Core.o_dom.$('[data-view="users"]', scope);
        if (!view) return;
        const form = Core.o_dom.$("#userForm", scope);
        const message = Core.o_dom.$("#userMessage", scope);
        form?.addEventListener("submit", (event) => {
          event.preventDefault();
          const usernameField = Core.o_dom.$("#userIdentifier", scope);
          const username = usernameField?.value.trim();
          if (!username) {
            Core.o_dom.setMessage(message, "Username is required.", "error");
            return;
          }
          const payload = {
            id: username,
            role: Core.o_dom.$("#userRole", scope)?.value,
            password: Core.o_dom.$("#userPassword", scope)?.value.trim()
          };
          Core.a_users.upsert(payload);
          Core.o_dom.setMessage(message, "User saved successfully.");
        });
        Core.o_dom.$("#resetUser", scope)?.addEventListener("click", () => {
          form?.reset();
          const roleField = Core.o_dom.$("#userRole", scope);
          if (roleField) {
            roleField.value = "user";
          }
          Core.o_dom.setMessage(message, "Form cleared.");
        });
        Core.o_dom.$$('[data-action=edit-user]', view).forEach((button) => {
          button.addEventListener("click", () => {
            const row = button.closest("tr");
            if (!row) return;
            const user = Core.x_state.db.users.find((entry) => entry.id === row.dataset.id);
            if (!user) return;
            Core.o_dom.$("#userIdentifier", scope).value = user.id;
            Core.o_dom.$("#userRole", scope).value = user.role;
            Core.o_dom.$("#userPassword", scope).value = "";
            Core.o_dom.setMessage(message, "Editing user. Update details and save.");
          });
        });
        Core.o_dom.$$('[data-action=delete-user]', view).forEach((button) => {
          button.addEventListener("click", () => {
            const row = button.closest("tr");
            if (!row) return;
            if (confirm("Remove this user?")) {
              Core.a_users.delete(row.dataset.id);
            }
          });
        });
      },
      bindSettings(scope) {
        const view = Core.o_dom.$('[data-view="settings"]', scope);
        if (!view) return;
        const settingsForm = Core.o_dom.$("#settingsForm", scope);
        const settingsMessage = Core.o_dom.$("#settingsMessage", scope);
        settingsForm?.addEventListener("submit", (event) => {
          event.preventDefault();
          Core.a_settings.saveSettings(
            {
              apiUrl: Core.o_dom.$("#settingsApi", scope)?.value.trim() || "",
              autoSync: Core.o_dom.$("#settingsSync", scope)?.value !== "false"
            },
            settingsMessage
          );
        });
        const exportBtn = Core.o_dom.$("#exportData", scope);
        const formatBtn = Core.o_dom.$("#formatDatabase", scope);
        const importInput = Core.o_dom.$("#importDatabase", scope);
        const dataMessage = Core.o_dom.$("#dataToolsMessage", scope);
        exportBtn?.addEventListener("click", () => {
          Core.a_settings.exportDb(dataMessage);
        });
        formatBtn?.addEventListener("click", () => {
          if (confirm("Reset database to defaults? This will remove all current data.")) {
            Core.a_settings.resetDb(dataMessage);
          }
        });
        importInput?.addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          await Core.a_settings.importDb(file, dataMessage);
          event.target.value = "";
        });
        const locationForm = Core.o_dom.$("#locationForm", scope);
        const locationMessage = Core.o_dom.$("#locationMessage", scope);
        locationForm?.addEventListener("submit", (event) => {
          event.preventDefault();
          const input = Core.o_dom.$("#locationName", scope);
          const value = input?.value || "";
          Core.a_settings.addLocation(value, locationMessage);
        });
        Core.o_dom.$$('[data-remove-location]', view).forEach((button) => {
          button.addEventListener("click", () => {
            Core.a_settings.removeLocation(button.dataset.removeLocation, Core.o_dom.$("#locationMessage", scope));
          });
        });
      }
    };

    Core.h_app = {
      start() {
        Core.a_db.initialize();
        Core.a_session.initialize();
        Core.a_views.renderApp();
      }
    };

    Core.h_app.start();
  </script>
</body>
</html>
